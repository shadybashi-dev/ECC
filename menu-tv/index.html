<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b111b" />
    <meta name="description" content="A digital pizzeria menu board for restaurant TV screens." />
    <title>Pizza Menu · Restaurant TV Board</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b111b;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      /* Keep kiosk controls responsive without browser tap highlights. */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
